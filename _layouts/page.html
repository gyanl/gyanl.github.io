---
layout: default
---
<article class="post">

  <header class="entry-header measure">
    <h1 class="entry-title">{{ page.title | escape }}</h1>
    {%- if page.description %}
    <div class="entry-subtitle">{{ page.description }}</div>
    {%- endif %}
  </header>

  <div class="prose measure">
    {{ content }}
  </div>

</article>
