title: Gyan Lakhwani
email: hello@gyanl.com

# What a link preview and a search result say under the title. It used to be
# "Made with <3 in New Delhi, India", which is the footer's line — charming
# there, and no use at all to someone deciding whether to click.
description: > # this means to ignore newlines until "show_excerpts:"
  New Delhi based interaction designer with a decade of experience working with
  pixels, systems, and code.

# A map, not a string. As a string, jekyll-seo-tag read the whole name as a
# Twitter handle and emitted twitter:creator="@Gyan Lakhwani".
author:
  name: Gyan Lakhwani
  twitter: gyanl

# The site's own address, and it has to be here. Without it jekyll-seo-tag has
# nothing to build absolute URLs from and falls back to the GitHub Pages
# metadata — a production build was emitting a canonical and an og:url of
# https://github.com/pages/gyanl/, and og:image would have inherited the same
# wrong base. A link preview needs an absolute image URL or it shows no image
# at all.
url: https://gyanl.com

# The link preview card. 1200x630, JPEG on purpose: WebP is still unreliable in
# the scrapers that matter for a link sent to a person — iMessage, WhatsApp,
# LinkedIn — and a preview that quietly drops the image is worse than a larger
# file.
#
# Set as a front matter DEFAULT rather than a bare `image:` key. jekyll-seo-tag
# reads page.image and has no site-level fallback, so a top-level image: is
# simply ignored — it was, silently, and the card kept coming out with no
# picture. A page may still override it with its own `image` in front matter.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/gyanl-og-image.jpg

# Empty on purpose, and stated rather than left out: the GitHub Pages metadata
# plugin fills an absent baseurl in from the repository, which put /pages/gyanl
# on the front of every canonical URL in a production build.
baseurl: ""

twitter:
  username: gyanl
  # Without this the card is the small square thumbnail rather than the
  # full-width image.
  card: summary_large_image

show_excerpts: false # set to true to show excerpts on the homepage

exclude:
  - _posts/Drafts/
  # jekyll-optional-front-matter renders bare .md files as pages, so these repo
  # docs would be published — and CLAUDE.md's Liquid examples break the build.
  - CLAUDE.md
  - README.md
  - CODE_OF_CONDUCT.md


permalink: /:title

# Courses I teach — a normal collection whose items appear in the home work
# grid under the "Teaching" filter. permalink /:name puts each at /dv, /ergo,
# /tech1; those paths are also served by the standalone course repos, which
# take precedence, so a card opens the real minisite and the page generated
# here is a harmless fallback.
collections:
  teaching:
    output: true
    permalink: /:name

# Sections shown in the home page work grid, in order. `tag` must match a post
# tag; `name` is the filter button label. Each also needs a tag/<tag>.md stub.
home_tags:
  - tag: work
    name: Work
  - tag: fonts
    name: Type Design
  - tag: talks
    name: Talks
  - tag: uiux
    name: UI/UX
  - tag: code
    name: Code
  - tag: sketchnotes
    name: Sketchnotes
  - tag: branding
    name: Branding

# Minima date format
# refer to https://shopify.github.io/liquid/filters/date/ if you want to customize this
minima:
  date_format: "%d %B, %Y"

  # generate social links in footer
  social_links:
    twitter: gyanl
    github:  gyanl
    # rss: rss
    dribbble: gyanl
    # facebook: jekyll
    # flickr:   jekyll
    instagram: gyanl
    linkedin: gyanlakhwani
    # pinterest: jekyll
    # youtube: jekyll
    # youtube_channel: UC8CXR0-3I70i1tfPg1PAE1g
    # youtube_channel_name: CloudCannon
    # telegram: jekyll
    # googleplus: +jekyll
    # microdotblog: jekyll
    # keybase: jekyll

    # Mastodon instances
    # mastodon:
    # - username: jekyll
    #   instance: example.com
    # - username: jekyll2
    #   instance: example.com

# If you want to link only specific pages in your header, uncomment
# this and add the path to the pages in order as they should show up
#header_pages:
# - about.md

# Build settings

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jemoji

theme: jekyll-theme-minimal
